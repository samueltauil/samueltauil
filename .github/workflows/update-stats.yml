name: Update GitHub Stats

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-content
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: samueltauil
          filename: assets/github-stats.svg
          base: ""
          config_timezone: America/New_York
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_stars: yes

      - name: Bump stats image URL
        env:
          STATS_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacement = f'https://raw.githubusercontent.com/samueltauil/samueltauil/main/assets/github-stats.svg?v={os.environ["STATS_VERSION"]}'
          pattern = r'https://raw\.githubusercontent\.com/samueltauil/samueltauil/main/assets/github-stats\.svg\?v=[^)\s]+'
          text, substitutions = re.subn(pattern, replacement, text, count=1)

          if substitutions == 0:
              raise SystemExit('README stats marker not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
