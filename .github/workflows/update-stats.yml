name: Update GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: samueltauil
          filename: assets/github-stats.svg
          base: ""
          config_timezone: America/New_York
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_projects: yes
          plugin_projects_limit: 4
          plugin_stars: yes

      - name: Bump stats image URL
        env:
          STATS_VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = 'https://raw.githubusercontent.com/samueltauil/samueltauil/main/assets/github-stats.svg?v=__STATS_VERSION__'
          replacement = f'https://raw.githubusercontent.com/samueltauil/samueltauil/main/assets/github-stats.svg?v={os.environ["STATS_VERSION"]}'

          if marker not in text:
              raise SystemExit('README stats marker not found')

          path.write_text(text.replace(marker, replacement), encoding='utf-8')
          PY

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update GitHub stats [skip ci]"
            git push
          fi
